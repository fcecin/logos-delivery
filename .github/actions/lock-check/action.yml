name: 'Lock check'
description: >
  Runs `nimble lock` in a checkout of logos-delivery, with its nimble.lock in
  place. The check fails when Nimble cannot solve the requirements.

inputs:
  path:
    description: 'The checkout of logos-delivery to check.'
    default: '.'

outputs:
  succeeded:
    description: '"true" when `nimble lock` succeeded, else "false".'
    value: ${{ steps.lock.outputs.succeeded }}

runs:
  using: composite
  steps:
    - name: Install Nimble
      shell: bash
      working-directory: ${{ inputs.path }}
      run: make install-nimble

    - name: Run Nimble lock
      id: lock
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        nimble="$(make -s print-nimble-path)/nimble"
        # Try a second time from the committed lock and an empty nimbledeps
        # directory, so that a network error alone does not fail the check.
        if "${nimble}" lock --localdeps -y || {
          git checkout -- nimble.lock
          rm -rf nimbledeps nimble.paths
          "${nimble}" lock --localdeps -y
        }; then
          echo "succeeded=true" >> "${GITHUB_OUTPUT}"
        else
          echo "succeeded=false" >> "${GITHUB_OUTPUT}"
        fi
