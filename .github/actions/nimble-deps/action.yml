name: 'Install nimble deps'
description: >
  Restores the nimbledeps cache and the Nimble package cache unless disabled,
  and runs `make build-deps`, which installs the pinned Nimble, installs the
  dependencies recorded in nimble.lock with it, and audits the result.

inputs:
  nim-version:
    description: 'The Nim version on PATH. A cache key component: the compiler builds the cached native libraries.'
    required: true
  cache:
    description: 'Restore and save the nimbledeps cache. Set "false" to disable.'
    default: 'true'
  make-args:
    description: 'Extra arguments for the C library rebuild make calls.'
    default: ''

runs:
  using: composite
  steps:
    - name: Cache nimble deps
      id: cache
      if: ${{ inputs.cache != 'false' }}
      uses: actions/cache@v3
      with:
        path: |
          nimbledeps/
          nimble.paths
        key: ${{ runner.os }}-${{ runner.arch }}-nimbledeps-v6-nim${{ inputs.nim-version }}-${{ hashFiles('nimble.lock', 'logos_delivery.nimble', 'BearSSL.mk', 'Nat.mk') }}

    # `nimble setup` clones every URL requirement into ~/.nimble/pkgcache to
    # read its manifest, even when the package is already installed: 13 git
    # downloads per job on a nimbledeps cache hit, 47 on a miss. With the
    # package cache restored, setup downloads nothing on a hit and only the
    # packages a lock change added on a miss (restore-keys). Nimble never
    # prunes the cache, so it grows a little with each lock change; bump v1
    # to start it afresh.
    - name: Cache the Nimble package cache
      if: ${{ inputs.cache != 'false' }}
      uses: actions/cache@v3
      with:
        path: ~/.nimble/pkgcache
        key: ${{ runner.os }}-nimble-pkgcache-v1-${{ hashFiles('nimble.lock') }}
        restore-keys: |
          ${{ runner.os }}-nimble-pkgcache-v1-

    - name: Install nimble deps
      shell: bash
      # Runs on cache hit and miss. make installs the pinned Nimble into the
      # directory it invokes it from, then installs and audits from
      # nimble.lock. Nothing is added to PATH: the runner image's Nimble stays
      # where setup-nim-action put it and no recipe runs Nimble by name.
      run: |
        make build-deps ${{ inputs.make-args }}
