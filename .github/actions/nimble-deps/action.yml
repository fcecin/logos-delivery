name: 'Install nimble deps'
description: >
  Installs the pinned Nimble, restores the nimbledeps cache unless disabled,
  and runs `make build-deps`, which installs the dependencies recorded in
  nimble.lock and audits the result.

inputs:
  nim-version:
    description: 'The Nim version on PATH. A cache key component: the compiler builds the cached native libraries.'
    required: true
  cache:
    description: 'Restore and save the nimbledeps cache. Set "false" to disable.'
    default: 'true'
  make-args:
    description: 'Extra arguments for the C library rebuild make calls.'
    default: ''

runs:
  using: composite
  steps:
    # The pinned Nimble must exist before make starts. GNU make caches the
    # PATH directories it searches, so a binary that appears during the run is
    # not found: setup then runs with whatever Nimble the runner image ships.
    - name: Install the pinned Nimble
      shell: bash
      run: |
        NIMBLE_REVISION=$(sed -n 's/^const RequiredNimbleRevision = "\([^"]*\)"/\1/p' logos_delivery.nimble)
        scripts/install_nimble.sh "${NIMBLE_REVISION}"
        echo "$HOME/.nimble/bin" >> $GITHUB_PATH
        echo "$HOME/.local/nimble-${NIMBLE_REVISION}/bin" >> $GITHUB_PATH

    - name: Cache nimble deps
      id: cache
      if: ${{ inputs.cache != 'false' }}
      uses: actions/cache@v3
      with:
        path: |
          nimbledeps/
          nimble.paths
        key: ${{ runner.os }}-${{ runner.arch }}-nimbledeps-v6-nim${{ inputs.nim-version }}-${{ hashFiles('nimble.lock', 'logos_delivery.nimble', 'BearSSL.mk', 'Nat.mk') }}

    - name: Install nimble deps
      shell: bash
      # Runs on cache hit and miss. The Makefile installs and audits from
      # nimble.lock.
      run: |
        make build-deps ${{ inputs.make-args }}
