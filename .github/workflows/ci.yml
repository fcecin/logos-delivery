name: ci

# Mutation run. Runs only the test files in .github/mutation-tests.txt. This
# workflow is for a throwaway fork PR and never goes upstream.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NIM_VERSION: '2.2.6'

jobs:
  list:
    runs-on: ubuntu-22.04
    outputs:
      tests: ${{ steps.read.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "tests=$(jq -R -s -c 'split("\n") | map(select(length > 0))' .github/mutation-tests.txt)" >> "$GITHUB_OUTPUT"

  test:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.list.outputs.tests) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    name: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Install the RLN test dependencies (anvil)
        run: make rln-deps

      - name: Run one test file
        run: |
          export MAKEFLAGS="-j1"
          export NIMFLAGS="--colors:off -d:chronicles_colors:none"
          make V=1 test ${{ matrix.test }}
