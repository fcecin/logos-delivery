name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--colors:off -d:chronicles_colors:none"

jobs:
  changes: # run only the jobs relevant to what a PR touches
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    steps:
    - uses: actions/checkout@v4
      name: Checkout code
      id: checkout
    # `all` is a deny-list rather than an allow-list: every path runs the whole
    # CI unless it is docs or one of the narrow areas below, so a new source
    # directory is covered without anyone remembering to extend this filter.
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        # 'some-with-excludes' is what makes the '!' patterns subtractive; the
        # default 'some' would match every file against the bare '**'.
        predicate-quantifier: 'some-with-excludes'
        filters: |
          all:
          - '**'
          - '!**/*.md'
          - '!docs/**'
          - '!LICENSE-*'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!tests/**'
          - '!tests-e2e/**'
          - '!examples/**'
          - '!docker/**'
          - '!.dockerignore'
          - '!nix/**'
          - '!flake.nix'
          - '!flake.lock'
          tests:
          - 'tests/**'
          - '!**/*.md'
          e2e:
          - 'tests-e2e/**'
          - '!**/*.md'
          examples:
          - 'examples/**'
          - '!**/*.md'
          docker:
          - 'docker/**'
          - '.dockerignore'
          - '!**/*.md'
          nix:
          - 'nix/**'
          - 'flake.nix'
          - 'flake.lock'
          - '!**/*.md'
          consumer:
          - 'logos_delivery.nimble'

    outputs:
      # A push to master runs everything so every master commit keeps a full CI record.
      all: ${{ github.event_name == 'push' || steps.filter.outputs.all == 'true' }}
      tests: ${{ steps.filter.outputs.tests }}
      e2e: ${{ steps.filter.outputs.e2e }}
      examples: ${{ steps.filter.outputs.examples }}
      docker: ${{ steps.filter.outputs.docker }}
      nix: ${{ steps.filter.outputs.nix }}
      consumer: ${{ steps.filter.outputs.consumer }}

  # Fails when this PR makes logos-delivery unresolvable for a project that
  # depends on it. When master fails too, this PR is not the cause, and the
  # daily CI reports the failure.
  consumer-deps:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.consumer == 'true' }}
    name: "Consumer dependency resolution"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up a consumer of this PR
        id: pr
        uses: ./.github/actions/consumer-setup
        with:
          revision: ${{ github.sha }}

      - name: Set up a consumer of master
        id: master
        if: ${{ steps.pr.outputs.succeeded != 'true' }}
        uses: ./.github/actions/consumer-setup
        with:
          revision: ${{ github.event.pull_request.base.sha }}

      - name: Fail if only this PR fails
        if: ${{ steps.pr.outputs.succeeded != 'true' && steps.master.outputs.succeeded == 'true' }}
        run: |
          echo "::error::With this PR, a project that requires logos-delivery cannot set up its dependencies"
          exit 1

  ci-required:
    if: always()
    needs:
      - changes
      - consumer-deps
    runs-on: ubuntu-22.04
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
