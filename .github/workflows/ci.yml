name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--colors:off -d:chronicles_colors:none"

jobs:
  changes: # run only the jobs relevant to what a PR touches
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    steps:
    - uses: actions/checkout@v4
      name: Checkout code
      id: checkout
    # `all` is a deny-list rather than an allow-list: every path runs the whole
    # CI unless it is docs or one of the narrow areas below, so a new source
    # directory is covered without anyone remembering to extend this filter.
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        # 'some-with-excludes' is what makes the '!' patterns subtractive; the
        # default 'some' would match every file against the bare '**'.
        predicate-quantifier: 'some-with-excludes'
        filters: |
          all:
          - '**'
          - '!**/*.md'
          - '!docs/**'
          - '!LICENSE-*'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!tests/**'
          - '!tests-e2e/**'
          - '!examples/**'
          - '!docker/**'
          - '!.dockerignore'
          - '!nix/**'
          - '!flake.nix'
          - '!flake.lock'
          tests:
          - 'tests/**'
          - '!**/*.md'
          e2e:
          - 'tests-e2e/**'
          - '!**/*.md'
          examples:
          - 'examples/**'
          - '!**/*.md'
          docker:
          - 'docker/**'
          - '.dockerignore'
          - '!**/*.md'
          nix:
          - 'nix/**'
          - 'flake.nix'
          - 'flake.lock'
          - '!**/*.md'
          consumer:
          - 'logos_delivery.nimble'
          lock:
          - 'logos_delivery.nimble'
          - 'nimble.lock'

    outputs:
      # A push to master runs everything so every master commit keeps a full CI record.
      all: ${{ github.event_name == 'push' || steps.filter.outputs.all == 'true' }}
      tests: ${{ steps.filter.outputs.tests }}
      e2e: ${{ steps.filter.outputs.e2e }}
      examples: ${{ steps.filter.outputs.examples }}
      docker: ${{ steps.filter.outputs.docker }}
      nix: ${{ steps.filter.outputs.nix }}
      consumer: ${{ steps.filter.outputs.consumer }}
      lock: ${{ steps.filter.outputs.lock }}

  # Fails when this PR breaks Nimble setup for a new project that requires
  # logos-delivery. Don't fail CI for this PR if master was already broken.
  consumer-break-check:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.consumer == 'true' }}
    name: "Consumer break check"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check if this PR breaks consumers
        id: pr
        uses: ./.github/actions/consumer-setup
        with:
          revision: ${{ github.sha }}

      - name: Check if master breaks consumers
        id: base
        if: ${{ steps.pr.outputs.succeeded != 'true' }}
        uses: ./.github/actions/consumer-setup
        with:
          revision: ${{ github.event.pull_request.base.sha }}

      - name: Compare PR with master
        if: ${{ steps.pr.outputs.succeeded != 'true' }}
        env:
          BASE_SUCCEEDED: ${{ steps.base.outputs.succeeded }}
        run: |
          if [ "${BASE_SUCCEEDED}" = true ]; then
            echo "::error::This PR breaks Nimble setup for a project that requires logos-delivery. Master passes."
            exit 1
          fi
          echo "Nimble setup also fails on master, so this PR cannot be blamed."

  # Fails when `nimble lock` fails for this PR. Don't fail CI for this PR if
  # master was already broken.
  lock-break-check:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lock == 'true' }}
    name: "Lock break check"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check if this PR breaks the lock
        id: pr
        uses: ./.github/actions/lock-check

      - name: Check out master
        if: ${{ steps.pr.outputs.succeeded != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check if master breaks the lock
        id: base
        if: ${{ steps.pr.outputs.succeeded != 'true' }}
        uses: ./.github/actions/lock-check
        with:
          path: base

      - name: Compare PR with master
        if: ${{ steps.pr.outputs.succeeded != 'true' }}
        env:
          BASE_SUCCEEDED: ${{ steps.base.outputs.succeeded }}
        run: |
          if [ "${BASE_SUCCEEDED}" = true ]; then
            echo "::error::With this PR, Nimble lock fails. Master passes."
            exit 1
          fi
          echo "Nimble lock also fails on master, so this PR cannot be blamed."

  ci-required:
    if: always()
    needs:
      - changes
      - consumer-break-check
      - lock-break-check
    runs-on: ubuntu-22.04
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
