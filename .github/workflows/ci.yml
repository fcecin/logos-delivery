name: ci

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none -d:disableMarchNative"
  NIM_VERSION: '2.2.6'

jobs:
  changes: # changes detection
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    steps:
    - uses: actions/checkout@v4
      name: Checkout code
      id: checkout
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          common:
          - '.github/workflows/**'
          - '.github/actions/**'
          - 'BearSSL.mk'
          - 'Nat.mk'
          - 'nix/**'
          - 'nimble.lock'
          - 'logos_delivery.nimble'
          - 'Makefile'
          - 'vendor/zerokit'
          - 'config.nims'
          - 'scripts/**'
          - 'flake.nix'
          - 'flake.lock'
          - 'library/**'
          - 'examples/**'
          v2:
          - 'logos_delivery/**'
          - 'apps/**'
          - 'tools/**'
          - 'tests/all_tests_v2.nim'
          - 'tests/**'
          - 'tests-e2e/**'
          docker:
          - 'docker/**'

    outputs:
      common: ${{ steps.filter.outputs.common }}
      v2: ${{ steps.filter.outputs.v2 }}
      docker: ${{ steps.filter.outputs.docker }}

  build-health:
    uses: ./.github/workflows/build-health.yml

  build:
    needs: changes
    if: ${{ needs.changes.outputs.v2 == 'true' || needs.changes.outputs.common == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    name: build-${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build binaries
        # -j1: `all` builds wakunode2 and liblogosdelivery, each via `nimble
        # <task>`. Under -j2 the two nimble invocations re-resolve git deps
        # concurrently and clobber each other in the shared ~/.nimble/pkgcache
        # (e.g. "destination already exists", "could not lock config file"),
        # failing the build. Serializing the targets removes the race; Nim's
        # own --parallelBuild still parallelizes compilation. Mirrors the test
        # job, which already forces -j1.
        run: make V=1 -j1 all

      - name: Link a consumer against liblogosdelivery
        run: |
          ext=so; [ "$RUNNER_OS" = macOS ] && ext=dylib
          PROBE_CONSUMER=library scripts/link_probe.sh shared build/liblogosdelivery.$ext

      - name: Build FFI examples
        run: make V=1 -j1 ffi-examples

      - name: Audit installed deps
        run: make audit-deps

      # Publish the freshly built shared library so the interop-tests workflow
      # can run the wrapper suite against it without rebuilding. Only the Linux
      # build is uploaded since the interop runners are ubuntu-latest.
      - name: Upload liblogosdelivery.so
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery
          path: build/liblogosdelivery.so
          retention-days: 1

  # Every other job builds the portable path: the workflow-level NIMFLAGS carry
  # -d:disableMarchNative, and config.nims treats that path separately from the
  # one a developer gets from a plain `make liblogosdelivery` (-march=native on
  # x86, -mcpu=apple-m1 on Apple silicon). This job builds that developer path.
  # Nothing runs: a native build proves compile and link on this runner's CPU,
  # nothing about runtime. A probe then links against the shared and the static
  # library, so unresolved symbols fail here and not on a consumer's machine.
  # Windows already builds without the define in windows-build.yml.
  liblogosdelivery-native:
    needs: changes
    if: ${{ needs.changes.outputs.v2 == 'true' || needs.changes.outputs.common == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none"

    name: liblogosdelivery developer build (native arch) - ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      # The probe's own controls: it must reject the broken fixtures on this
      # runner's toolchain before its verdict on the real library means anything.
      - name: Probe self-test
        run: scripts/link_probe_selftest.sh

      - name: Build the shared library with the developer flags
        run: make V=1 -j1 liblogosdelivery

      - name: Link a consumer against the shared library
        run: |
          ext=so; [ "$RUNNER_OS" = macOS ] && ext=dylib
          PROBE_CONSUMER=library scripts/link_probe.sh shared build/liblogosdelivery.$ext

      - name: Build the static library with the developer flags
        run: make V=1 -j1 liblogosdelivery STATIC=1

      # librln is the one archive a consumer supplies itself, so it goes on the
      # probe's link line; everything else must already be inside the .a.
      - name: Link a consumer against the static library
        run: PROBE_CONSUMER=library scripts/link_probe.sh static build/liblogosdelivery.a librln_v2.0.2.a

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Keyed on the script so a change of the pinned cross rev invalidates it.
      - name: Cache cross
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-${{ hashFiles('scripts/build_rln_android.sh') }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}
          # The NDK compiler rewrites the nimbledeps archives, so this job does not share the host jobs' cache.
          cache: 'false'

      - name: Build liblogosdelivery for android-${{ matrix.target }}
        # -j1: see the build job.
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: make V=1 -j1 liblogosdelivery-android-${{ matrix.target }}

      # The probe resolves every DT_NEEDED entry of the .so (librln next to it,
      # the rest from the NDK sysroot) and links them explicitly, because lld
      # checks a shared object's unresolved symbols only when all of its
      # needed libraries are inputs. Its self-test runs with the same clang.
      - name: Probe self-test and link a consumer against the Android library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          case "${{ matrix.target }}" in
            arm64) abi=arm64-v8a;   triple=aarch64-linux-android ;;
            amd64) abi=x86_64;      triple=x86_64-linux-android ;;
            x86)   abi=x86;         triple=i686-linux-android ;;
            arm)   abi=armeabi-v7a; triple=armv7a-linux-androideabi ;;
          esac
          bin=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PROBE_CC="$bin/${triple}30-clang" PROBE_READELF="$bin/llvm-readelf" PROBE_OS=linux
          scripts/link_probe_selftest.sh
          PROBE_CONSUMER=library scripts/link_probe.sh shared build/android/$abi/liblogosdelivery.so

      - name: Audit installed deps
        run: make audit-deps

      - name: Upload android libraries
        uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery-android-${{ matrix.target }}
          path: build/android/
          retention-days: 1

  # macos-15 runners ship full Xcode with the iOS SDKs preinstalled.
  build-ios:
    needs: changes
    if: ${{ needs.changes.outputs.v2 == 'true' || needs.changes.outputs.common == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [device, simulator]
    runs-on: macos-15
    timeout-minutes: 60

    name: build-ios-${{ matrix.sdk }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Shares the host macOS cache: the iOS build never writes into nimbledeps/.
      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build liblogosdelivery for ios-${{ matrix.sdk }}
        # -j1: see the build job.
        run: make V=1 -j1 liblogosdelivery-ios-${{ matrix.sdk }}

      # Force-loads the whole archive with the iOS toolchain, the way an app
      # links it. The librln exports a consumer supplies itself are the only
      # unresolved symbols allowed (scripts/link_probe_rln_exports.txt). The
      # probe's self-test runs with the same toolchain first.
      - name: Probe self-test and link a consumer against the iOS library
        run: |
          sdk=iphoneos; minflag=-mios-version-min=18.0
          if [ "${{ matrix.sdk }}" = simulator ]; then sdk=iphonesimulator; minflag=-mios-simulator-version-min=18.0; fi
          export PROBE_CC="xcrun -sdk $sdk clang" PROBE_OS=darwin
          export PROBE_FLAGS="-arch arm64 -isysroot $(xcrun --sdk $sdk --show-sdk-path) $minflag"
          scripts/link_probe_selftest.sh
          PROBE_ALLOW_FILE=scripts/link_probe_rln_exports.txt PROBE_CONSUMER=library scripts/link_probe.sh static build/ios/$sdk-arm64/liblogosdelivery.a

      - name: Audit installed deps
        run: make audit-deps

      - name: Upload iOS library
        uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery-ios-${{ matrix.sdk }}
          path: |
            build/ios/*/liblogosdelivery.a
            build/ios/*/liblogosdelivery.h
          retention-days: 1

  test:
    needs: changes
    if: ${{ needs.changes.outputs.v2 == 'true' || needs.changes.outputs.common == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    # `make test` now builds three test binaries; the third pushed ubuntu past
    # the previous 60.
    timeout-minutes: 90

    name: test-${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Run tests
        run: |
          postgres_enabled=0
          if [ ${{ runner.os }} == "Linux" ]; then
            sudo docker run --rm -d -e POSTGRES_PASSWORD=test123 -p 5432:5432 postgres:15.4-alpine3.18
            postgres_enabled=1
          fi

          export MAKEFLAGS="-j1"
          export NIMFLAGS="--colors:off -d:chronicles_colors:none -d:disableMarchNative"
          export USE_LIBBACKTRACE=0

          make V=1 POSTGRES=$postgres_enabled test
          make V=1 POSTGRES=$postgres_enabled testwakunode2

      - name: Audit installed deps
        run: make audit-deps

  build-docker-image:
    needs: changes
    if: ${{ needs.changes.outputs.v2 == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.docker == 'true' }}
    uses: ./.github/workflows/container-image.yml
    secrets: inherit

  # Docker-based interop smoke tests. Gated only on the docker image so they
  # still run on docker-only PRs (no liblogosdelivery build required).
  nwaku-nwaku-interop-tests:
    needs: build-docker-image
    # The commit is tag SMOKE_TEST_2026.06.25; annotated tag refs break nested
    # workflow resolution on push events, so pin the commit. Re-pin on bumps.
    uses: logos-messaging/logos-delivery-interop-tests/.github/workflows/nim_waku_PR.yml@6980880dba70aebe443b1ea1864891940980ecea
    with:
      node_nwaku: ${{ needs.build-docker-image.outputs.image }}

    secrets: inherit

  # Send API E2E tests run the in-repo tests-e2e/ wrapper suite against the
  # liblogosdelivery.so built by the `build` job (downloaded as the
  # `liblogosdelivery` artifact). Gated on `build`, so it is skipped on
  # docker-only PRs where no lib is built.
  send-api-e2e-tests:
    needs: build
    uses: ./.github/workflows/e2e-api-tests.yml
    with:
      subset: non-docker
    secrets: inherit

  # Docker subset; an empty node_image falls back to DEFAULT_NWAKU (fork PRs lack the quay secrets).
  send-api-e2e-docker-tests:
    needs: [build, build-docker-image]
    uses: ./.github/workflows/e2e-api-tests.yml
    with:
      subset: docker
      node_image: ${{ needs.build-docker-image.outputs.image }}
    secrets: inherit

  # E2E tests that run the node docker image and drive it over its REST API
  rest-e2e-tests:
    needs: build-docker-image
    uses: ./.github/workflows/e2e-rest-tests.yml
    with:
      node_image: ${{ needs.build-docker-image.outputs.image }}
    secrets: inherit

  lint:
    name: "Lint"
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build nph
        run: |
          make build-nph

      - name: Check nph formatting
        run: |
          shopt -s extglob  # Enable extended globbing
          NPH=$(make print-nph-path)
          echo "using nph at ${NPH}"
          "${NPH}" examples logos_delivery tests tools apps *.@(nim|nims|nimble)
          git diff --exit-code
