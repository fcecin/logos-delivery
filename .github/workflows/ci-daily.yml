name: Daily logos-delivery CI

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none -d:disableMarchNative"
  NIM_PARAMS: "-d:disableMarchNative"
  NIM_VERSION: '2.2.4'
  NIMBLE_VERSION: '0.24.1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    name: build-${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # macos images ship no nim/nimble; make dies at "nimble: No such file or directory".
      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nimble ${{ env.NIMBLE_VERSION }}
        run: |
          scripts/install_nimble.sh "${{ env.NIMBLE_VERSION }}"
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          echo "$HOME/.local/nimble-${{ env.NIMBLE_VERSION }}/bin" >> $GITHUB_PATH

      - name: Get submodules hash
        id: submodules
        run: |
          echo "hash=$(git submodule status | awk '{print $1}' | sort | shasum -a 256 | sed 's/[ -]*//g')" >> $GITHUB_OUTPUT

      - name: Cache submodules
        uses: actions/cache@v3
        with:
          path: |
            vendor/
            .git/modules
          key: ${{ runner.os }}-vendor-modules-${{ steps.submodules.outputs.hash }}

      - name: Generate requires string
        run: python3 scripts/gen_requires.py > requires.generated

      - name: Cache nimble deps
        id: cache-nimbledeps
        uses: actions/cache@v3
        with:
          path: |
            nimbledeps/
            nimble.paths
          key: ${{ runner.os }}-nimbledeps-v4-nimble${{ env.NIMBLE_VERSION }}-${{ hashFiles('requires.generated', 'logos_delivery.nimble', 'BearSSL.mk', 'Nat.mk') }}

      - name: Install nimble deps
        if: steps.cache-nimbledeps.outputs.cache-hit != 'true'
        run: |
          # nim's source tree checksums differently across platforms, so its
          # locked checksum is unreliable. --useSystemNim uses the CI nim and
          # skips that check, while still verifying every other locked dep.
          nimble setup --localdeps -y --useSystemNim --requires "$(cat requires.generated)"

          # Nimble 0.24.x can install a revision that differs from the
          # requirement and exit with code 0. The audit fails this step when
          # the result differs from nimble.lock. See the header of
          # scripts/audit_deps.py for the procedure and references.
          python3 scripts/audit_deps.py

          make rebuild-nat-libs-nimbledeps
          make rebuild-bearssl-nimbledeps
          touch nimbledeps/.nimble-setup

      - name: Build binaries
        run: make V=1 examples tools

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          OS="${{ matrix.os }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ CI Success"
          else
            COLOR=15158332
            TITLE="❌ CI Failed"
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"OS\", \"value\": \"$OS\", \"inline\": true},
                  {\"name\": \"Status\", \"value\": \"$STATUS\", \"inline\": true}
                ],
                \"url\": \"$RUN_URL\",
                \"footer\": {\"text\": \"Daily logos-delivery CI\"}
              }]
            }" \
            "$DISCORD_WEBHOOK_URL"

  # RLN end-to-end against the simulator. Defaults from tests/simulator/rln-sim.env.
  rln-simulator:
    uses: ./.github/workflows/ci-rln-simulator.yml
    secrets: inherit

