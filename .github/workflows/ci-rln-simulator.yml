name: Daily logos-delivery CI

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none"

jobs:
  # Fails when `nimble lock` cannot solve logos_delivery.nimble from scratch.
  lock-resolution:
    name: "nimble.lock resolution"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run Nimble lock
        id: lock
        uses: ./.github/actions/lock-check
        with:
          target: master

      - name: Fail if Nimble lock failed
        if: ${{ steps.lock.outputs.succeeded != 'true' }}
        run: |
          echo "::error::Nimble lock fails on master (${GITHUB_SHA:0:8}). The notice \"Nimble lock fails on master\" shows the error."
          exit 1

  # Runs Nimble setup in a new project that requires the checked-out commit of
  # logos-delivery, with no lockfile.
  consumer-deps:
    name: "Consumer dependency resolution"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up a consumer of this commit
        id: setup
        uses: ./.github/actions/consumer-setup
        with:
          revision: ${{ github.sha }}
          target: master

      - name: Fail if the setup failed
        if: ${{ steps.setup.outputs.succeeded != 'true' }}
        run: |
          echo "::error::Nimble setup of a project that requires logos-delivery fails on master (${GITHUB_SHA:0:8}). The notice \"Nimble setup of a project that requires logos-delivery fails on master\" shows the error."
          exit 1
