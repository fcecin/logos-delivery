name: Pre-Release

on:
  # LOCAL-FORK-TEST: tag-push and cron triggers disabled on the fork; drive this
  # by hand with `gh workflow run pre-release.yml` only.
  # push:
  #   tags:
  #   - 'v*-rc.*'
  # schedule:
  #   - cron: 13 3 * * *
  workflow_dispatch:

env:
  RELEASE_NAME: nightly

  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC}"
  NIM_VERSION: '2.2.4'
  NIMBLE_VERSION: '0.22.3'

jobs:
  tag-name:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Vars
      id: vars
      run: |
        TAG=$([[ "${{github.ref}}" == "refs/heads/master" ]] && echo "${{env.RELEASE_NAME}}" || echo ${{github.ref}} | sed 's#refs/tags/##')
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
    outputs:
      tag: ${{steps.vars.outputs.tag}}

  build-and-publish:
    needs: tag-name
    strategy:
      # Without this, the first leg to fail cancels the other two and the run
      # reports one real failure plus two cancellations, hiding whether the
      # other platforms were fine. ci.yml already sets it.
      fail-fast: false
      matrix:
        # There is no macOS amd64 leg, deliberately.
        #
        # It used to be `macos-15 + amd64`, but macos-15 runners are arm64:
        # getMyCPU() in logos_delivery.nimble resolves the arch from the HOST at
        # nimble-script compile time, and the Makefile reads NIM_PARAMS rather
        # than the NIMFLAGS this workflow passes. That leg therefore compiled
        # `--cpu:arm64 --passC:"-arch arm64"` and published an arm64 binary named
        # nwaku-amd64-macos-*.tar.gz — a mislabelled duplicate of the arm64 leg.
        #
        # Every GitHub-hosted macOS image is now arm64 (macos-13, the last Intel
        # one, no longer schedules — verified 2026-08-07: the job sat queued 11
        # minutes while its siblings started immediately). Producing a real
        # darwin/amd64 artifact would need actual cross-compilation, with
        # -arch x86_64 threaded through librln, BoringSSL and the nat libs too.
        # Until someone does that, ship two honest platforms rather than three
        # with one lie.
        include:
        - os: ubuntu-22.04
          arch: amd64
        - os: macos-15
          arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # macos images ship no nim/nimble; make dies at "nimble: No such file or directory".
      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nimble ${{ env.NIMBLE_VERSION }}
        run: |
          cd /tmp && nimble install "nimble@${{ env.NIMBLE_VERSION }}" -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: prep variables
        id: vars
        run: |
          ARCH=${{matrix.arch}}

          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

          NWAKU_ARTIFACT_NAME=$(echo "nwaku-${ARCH}-${{runner.os}}-${{ needs.tag-name.outputs.tag }}.tar.gz" | tr "[:upper:]" "[:lower:]")
          NWAKU_TOOLS_ARTIFACT_NAME=$(echo "nwaku-tools-${ARCH}-${{runner.os}}-${{ needs.tag-name.outputs.tag }}.tar.gz" | tr "[:upper:]" "[:lower:]")

          echo "nwaku=${NWAKU_ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "nwakutools=${NWAKU_TOOLS_ARTIFACT_NAME}" >> $GITHUB_OUTPUT


      - name: build artifacts
        id: build
        run: |
          OS=$([[ "${{runner.os}}" == "macOS" ]] && echo "macosx" || echo "linux")

          make V=1 CI=false NIMFLAGS="-d:disableMarchNative --os:${OS} --cpu:${{matrix.arch}}" \
            update

          # -j1: each of these targets shells out to `nimble <task>`. Under the
          # job-level MAKEFLAGS=-j2 two nimble invocations re-resolve git deps
          # concurrently and clobber each other in the shared package dir — the
          # 2026-08-07 nightly died on a torn read of
          # nimbledeps/pkgs2/libp2p-*/nimblemeta.json ("{ expected"), and the
          # target that lost the race was whichever got there second.
          # Serializing removes it; Nim's own --parallelBuild still parallelizes
          # compilation. Same fix as `make V=1 -j1 all` in ci.yml and the
          # sequential invocations in container-image.yml.
          make V=1 -j1 CI=false POSTGRES=1\
            NIMFLAGS="-d:disableMarchNative --os:${OS} --cpu:${{matrix.arch}}" \
            wakunode2\
            logosdeliverynode\
            chat2\
            tools

          tar -cvzf ${{steps.vars.outputs.nwaku}} ./build/wakunode2 ./build/logosdeliverynode ./build/chat2
          tar -cvzf ${{steps.vars.outputs.nwakutools}} ./build/wakucanary ./build/networkmonitor

      # Artifact names must be unique per matrix leg. All three legs used to
      # upload as plain `wakunode2`/`wakutools`; download-artifact@v4 with no
      # `name:` puts each artifact in a directory named after it, so three
      # same-named artifacts collapse into one and only the last upload
      # survived. create-release-candidate then published a single platform —
      # verified in run 31178778182, where the job received only
      # nwaku-amd64-macos-nightly.tar.gz and the 212MB Linux build was lost.
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wakunode2-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{steps.vars.outputs.nwaku}}
          retention-days: 2

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wakutools-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{steps.vars.outputs.nwakutools}}
          retention-days: 2

  build-docker-image:
    needs: tag-name
    # Was `logos-messaging/logos-delivery/.github/workflows/container-image.yml@master`.
    # An absolute owner/repo@master reference resolves against the DEFAULT BRANCH,
    # not the ref being built, so a PR that modifies container-image.yml was
    # silently tested against master's copy of it — and a fork could not exercise
    # its own version at all. ci.yml already uses the relative form (ci.yml:196);
    # this makes pre-release consistent with it.
    uses: ./.github/workflows/container-image.yml
    with:
      image_tag: ${{ needs.tag-name.outputs.tag }}
    secrets: inherit

  # The js-waku-node / js-waku-node-optional jobs were removed here. They called
  # logos-messaging/logos-delivery-js/.github/workflows/test-node.yml@master
  # against the freshly published nightly image. js-waku-node had failed
  # identically — 451 passing, 51 failing — every single nightly since at least
  # 2026-07-27, so it carried no signal, and a permanently red job trains people
  # to stop reading the nightly. That is precisely how four stacked build bugs
  # survived for weeks behind it. The equivalent jobs were already dropped from
  # PR CI; this was the last reference to that repo from here.
  #
  # The coverage itself is not this repo's to schedule: logos-delivery-js owns
  # that suite and can run it against a published image on its own cadence.

  create-release-candidate:
    runs-on: ubuntu-22.04
    needs: [ tag-name, build-and-publish ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      # `merge-multiple: true` flattens every matching artifact into one
      # directory, so `wakunode2/*` and `wakutools/*` below still resolve — but
      # now to all three platforms instead of whichever uploaded last.
      - name: download node artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wakunode2-*
          path: wakunode2
          merge-multiple: true

      - name: download tools artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wakutools-*
          path: wakutools
          merge-multiple: true

      - name: prep variables
        id: vars
        run: |
          REF=$(echo ${{github.ref}} | sed 's#.*/##')

          echo "ref=${REF}" >> $GITHUB_OUTPUT

      # PERMANENT — not fork scaffolding. This is the gate that makes a silent
      # packaging bug loud. Before it existed, three matrix legs uploaded under
      # the same artifact name, download-artifact kept one, and the nightly
      # published a single platform without failing anything; separately, the
      # macOS "amd64" leg shipped an arm64 binary under an amd64 name. Neither
      # defect could ever fail a build. Now they do: this asserts one tarball per
      # matrix leg and prints the real arch of every binary, before publishing.
      - name: verify release artifacts
        run: |
          set -e
          echo "### artifacts received ###"
          ls -lR wakunode2 wakutools
          echo
          echo "### per-tarball contents and REAL binary arch ###"
          for t in wakunode2/*.tar.gz wakutools/*.tar.gz; do
            echo "== $t =="
            tar -tzf "$t"
            rm -rf /tmp/x && mkdir -p /tmp/x && tar -xzf "$t" -C /tmp/x
            find /tmp/x -type f -exec file {} \;
            echo
          done
          echo "### assertion: one tarball per matrix leg ###"
          n=$(ls wakunode2/*.tar.gz | wc -l)
          echo "wakunode2 tarballs: $n (expected 2 — linux/amd64, macos/arm64)"
          [ "$n" -eq 2 ] || { echo "FAIL: artifact collision still present"; exit 1; }

      # LOCAL-FORK-TEST: publishing disabled — `gh release delete/create` writes to
      # GitHub Releases and the sv4git image is pulled from Docker Hub.
      # - name: generate release notes
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     set -x
      #     gh release view ${{ needs.tag-name.outputs.tag }} &>/dev/null &&\
      #       gh release delete -y ${{ needs.tag-name.outputs.tag }} &&\
      #       [[ "${{ needs.tag-name.outputs.tag }}" == "nightly" ]] && git tag -d ${{ needs.tag-name.outputs.tag }}
