name: Pre-Release

on:
  # LOCAL-FORK-TEST: tag-push and cron triggers disabled on the fork; drive this
  # by hand with `gh workflow run pre-release.yml` only.
  # push:
  #   tags:
  #   - 'v*-rc.*'
  # schedule:
  #   - cron: 13 3 * * *
  workflow_dispatch:

env:
  RELEASE_NAME: nightly

  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIM_PARAMS: "-d:disableMarchNative"
  NIM_VERSION: '2.2.4'
  NIMBLE_VERSION: '0.22.3'

jobs:
  tag-name:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Vars
      id: vars
      run: |
        # master -> nightly; other refs use their bare name, "/" replaced by "-".
        # TAG=$([[ "${{github.ref}}" == "refs/heads/master" ]] && echo "${{env.RELEASE_NAME}}" || echo ${{github.ref}} | sed 's#refs/tags/##')
        TAG=$([[ "${{github.ref}}" == "refs/heads/master" ]] && echo "${{env.RELEASE_NAME}}" || echo "${{github.ref_name}}" | tr '/' '-')
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
    outputs:
      tag: ${{steps.vars.outputs.tag}}

  build-and-publish:
    needs: tag-name
    strategy:
      # Without fail-fast: false, one failed job cancels the other jobs and
      # hides their results.
      fail-fast: false
      matrix:
        # GitHub macOS runners are arm64 only; darwin/amd64 needs a cross-compilation setup.
        include:
        - os: ubuntu-22.04
          arch: amd64
        - os: macos-15
          arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # macos images ship no nim/nimble; make dies at "nimble: No such file or directory".
      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nimble ${{ env.NIMBLE_VERSION }}
        run: |
          cd /tmp && nimble install "nimble@${{ env.NIMBLE_VERSION }}" -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: prep variables
        id: vars
        run: |
          ARCH=${{matrix.arch}}

          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

          NWAKU_ARTIFACT_NAME=$(echo "nwaku-${ARCH}-${{runner.os}}-${{ needs.tag-name.outputs.tag }}.tar.gz" | tr "[:upper:]" "[:lower:]")
          NWAKU_TOOLS_ARTIFACT_NAME=$(echo "nwaku-tools-${ARCH}-${{runner.os}}-${{ needs.tag-name.outputs.tag }}.tar.gz" | tr "[:upper:]" "[:lower:]")

          echo "nwaku=${NWAKU_ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "nwakutools=${NWAKU_TOOLS_ARTIFACT_NAME}" >> $GITHUB_OUTPUT


      - name: build artifacts
        id: build
        run: |
          # -j1: each target starts one nimble process. Two parallel nimble
          # processes corrupt the shared package metadata (nimblemeta.json).
          make V=1 -j1 CI=false POSTGRES=1\
            wakunode2\
            logosdeliverynode\
            chat2\
            tools

          tar -cvzf ${{steps.vars.outputs.nwaku}} ./build/wakunode2 ./build/logosdeliverynode ./build/chat2
          tar -cvzf ${{steps.vars.outputs.nwakutools}} ./build/wakucanary ./build/networkmonitor

      # Each matrix job must use a unique artifact name. With one shared
      # name, download-artifact@v4 keeps only the last upload and the release
      # loses platforms.
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wakunode2-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{steps.vars.outputs.nwaku}}
          retention-days: 2

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wakutools-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{steps.vars.outputs.nwakutools}}
          retention-days: 2

  build-docker-image:
    needs: tag-name
    # uses: logos-messaging/logos-delivery/.github/workflows/container-image.yml@master
    uses: ./.github/workflows/container-image.yml
    with:
      image_tag: ${{ needs.tag-name.outputs.tag }}
    secrets: inherit

  # js-waku-node:
  #   needs: build-docker-image
  #   uses: logos-messaging/logos-delivery-js/.github/workflows/test-node.yml@master
  #   permissions:
  #     contents: read
  #     actions: read
  #     checks: write
  #   with:
  #     nim_wakunode_image: ${{ needs.build-docker-image.outputs.image }}
  #     test_type: node
  #     debug: waku*

  # LOCAL-FORK-TEST: external logos-delivery-js workflow disabled on the fork.
  #   needs: build-docker-image
  #   uses: logos-messaging/logos-delivery-js/.github/workflows/test-node.yml@master
  #   permissions:
  #     contents: read
  #     actions: read
  #     checks: write
  #   with:
  #     nim_wakunode_image: ${{ needs.build-docker-image.outputs.image }}
  #     test_type: node-optional
  #     debug: waku*

  create-release-candidate:
    runs-on: ubuntu-22.04
    needs: [ tag-name, build-and-publish ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      # merge-multiple puts all matching artifacts into one directory.
      - name: download node artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wakunode2-*
          path: wakunode2
          merge-multiple: true

      - name: download tools artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wakutools-*
          path: wakutools
          merge-multiple: true

      - name: prep variables
        id: vars
        run: |
          REF=$(echo ${{github.ref}} | sed 's#.*/##')

          echo "ref=${REF}" >> $GITHUB_OUTPUT

      # This step examines the release artifacts before the publish steps.
      # If this step finds a fault, this step stops the release.
      # This step makes sure that:
      #   - tar can read each tarball (tar stops on a truncated tarball)
      #   - each tarball contains one or more regular files
      #   - the CPU type in each binary agrees with the arch in the tarball name
      #   - the node count and the tools count agree with the build matrix.
      - name: verify release artifacts
        run: |
          set -e
          echo "### artifacts received ###"
          ls -lR wakunode2 wakutools
          echo
          echo "### tarball contents and binary CPU type ###"
          for t in wakunode2/*.tar.gz wakutools/*.tar.gz; do
            echo "== $t =="
            tar -tzf "$t"
            rm -rf /tmp/x && mkdir -p /tmp/x && tar -xzf "$t" -C /tmp/x

            # The file command writes one line for each regular file:
            # "path: <CPU type>". The log and the two checks that follow
            # use this one output.
            types=$(find /tmp/x -type f -exec file {} \;)
            echo "$types"

            # The tarball name (nwaku-<arch>-<os>-<tag>.tar.gz) shows the
            # correct arch for the binaries in it. The case statement
            # changes this arch into the text that the file command writes.
            # For arm64 binaries, macOS shows "arm64" and Linux shows
            # "aarch64". If the name shows an unknown arch, this step
            # stops the release.
            case "$t" in
              *-amd64-*) want='x86-64' ;;
              *-arm64-*) want='arm64|aarch64' ;;
              *) echo "FAIL: unknown arch in name: $t"; exit 1 ;;
            esac

            # The pattern examines only the text after the ":" that the
            # file command writes. Thus a file name that contains the arch
            # text has no effect on the check. grep -Ev writes each line
            # that does not have the correct arch text there. This step
            # stops the release if a tarball is empty or if grep finds
            # one or more of these lines.
            if [ -z "$types" ] || echo "$types" | grep -Ev ": .*($want)"; then
              echo "FAIL: $t is empty or has a wrong CPU type (want: $want)"
              exit 1
            fi

            # Each node tarball must contain the three node binaries.
            # Each tools tarball must contain the two tools binaries.
            # This check finds a tarball with a missing binary.
            case "$t" in
              wakunode2/*) need="wakunode2 logosdeliverynode chat2" ;;
              wakutools/*) need="wakucanary networkmonitor" ;;
            esac
            for b in $need; do
              [ -f "/tmp/x/build/$b" ] || { echo "FAIL: $t does not contain build/$b"; exit 1; }
            done
            echo
          done
          echo "### tarball count check ###"
          # The build matrix makes one node tarball and one tools tarball
          # for each matrix entry. If you change the matrix, change EXPECTED.
          EXPECTED=2
          n=$(ls wakunode2/*.tar.gz | wc -l)
          m=$(ls wakutools/*.tar.gz | wc -l)
          echo "wakunode2 tarballs: $n, wakutools tarballs: $m (expected $EXPECTED each)"
          [ "$n" -eq "$EXPECTED" ] || { echo "FAIL: expected $EXPECTED node tarballs, found $n"; exit 1; }
          [ "$m" -eq "$EXPECTED" ] || { echo "FAIL: expected $EXPECTED tools tarballs, found $m"; exit 1; }

      - name: generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ needs.tag-name.outputs.tag }}"
          # This block deletes the old release and, for the nightly tag,
          # the remote tag. The create step reuses an existing tag and
          # ignores --target. Thus the nightly tag must go away here, so
          # that the create step makes a new tag at master, and the
          # nightly tag moves with master each night. A release can be
          # absent while its tag exists, thus the tag deletion is
          # separate from the release deletion. A version tag keeps its
          # tag: it already points at the correct commit, and only the
          # release is made again.
          if gh release view "$TAG" &>/dev/null; then
            gh release delete -y "$TAG"
          fi
          if [[ "$TAG" == "nightly" ]]; then
            if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
              git push origin ":refs/tags/$TAG"
            fi
            git tag -d "$TAG" || true
          fi

          RELEASE_NOTES_TAG=$([[ "${{ needs.tag-name.outputs.tag }}" != "nightly" ]] && echo "-t ${{steps.vars.outputs.ref}}" || echo "")

          docker run \
              -t \
              --rm \
              -v ${PWD}:/opt/sv4git/repo:z \
              -u $(id -u) \
              docker.io/wakuorg/sv4git:latest \
                release-notes ${RELEASE_NOTES_TAG} --previous $(git tag -l --sort -creatordate | grep -e "^v[0-9]*\.[0-9]*\.[0-9]*$") |\
                sed -E 's@#([0-9]+)@[#\1](https://github.com/logos-messaging/logos-delivery/issues/\1)@g' > release_notes.md

          sed -i "s/^## .*/Generated at $(date)/" release_notes.md

          cat release_notes.md

          TARGET=$([[ "${{ needs.tag-name.outputs.tag }}" == "nightly" ]] && echo "--target ${{steps.vars.outputs.ref}}" || echo "")

          gh release create ${{ needs.tag-name.outputs.tag }} --prerelease ${TARGET} \
            --title ${{ needs.tag-name.outputs.tag }} --notes-file release_notes.md \
            wakunode2/* wakutools/*
