name: sigill-hunt

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "S19 runs per hunt job"
        default: "12"
  push:
    branches:
      - 'fix/sigill-hunt*'

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none"
  NIM_VERSION: '2.2.6'
  NODE_IMAGE: quay.io/wakuorg/nwaku-pr:1dc0f92

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CPU of the build runner
        run: |
          lscpu | grep -E "Model name|Vendor ID"
          grep -o -w "avx512[a-z_]*\|vaes\|vpclmulqdq\|gfni\|avx2\|bmi2\|adx\|sha_ni" /proc/cpuinfo | sort -u | tr '\n' ' '; echo

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build liblogosdelivery
        run: make V=1 -j1 liblogosdelivery

      - name: Upload liblogosdelivery.so
        uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery-hunt
          path: build/liblogosdelivery.so
          retention-days: 2

  hunt:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        mode: [gdb, core]
        shard: [1, 2]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    name: hunt-${{ matrix.mode }}-${{ matrix.shard }}
    env:
      NODE_1: quay.io/wakuorg/nwaku-pr:1dc0f92
      NODE_2: quay.io/wakuorg/nwaku-pr:1dc0f92
      ITERATIONS: ${{ github.event.inputs.iterations || '12' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CPU of the hunt runner
        run: |
          lscpu | grep -E "Model name|Vendor ID"
          grep -o -w "avx512[a-z_]*\|vaes\|vpclmulqdq\|gfni\|avx2\|bmi2\|adx\|sha_ni" /proc/cpuinfo | sort -u | tr '\n' ' '; echo

      - name: Download liblogosdelivery.so
        uses: actions/download-artifact@v4
        with:
          name: liblogosdelivery-hunt
          path: tests-e2e/vendor/logos-delivery-python-bindings/lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests-e2e/requirements.txt

      - name: Install Python deps, gdb and the node image
        run: |
          pip install -r tests-e2e/requirements.txt
          sudo apt-get install -y gdb > /dev/null
          docker pull -q "$NODE_1"

      - name: Run S19 in a loop
        working-directory: tests-e2e
        run: |
          set -u
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p
          ulimit -c unlimited
          PY=$(command -v python)
          crashed=0
          for i in $(seq 1 "$ITERATIONS"); do
            rm -f /tmp/core.*
            if [ "${{ matrix.mode }}" = gdb ]; then
              gdb -batch -q -ex "set pagination off" -ex "handle all nostop noprint pass" \
                -ex "handle SIGILL stop print nopass" -ex "handle SIGSEGV stop print nopass" \
                -ex "handle SIGBUS stop print nopass" -ex "handle SIGABRT stop print nopass" \
                -ex run -ex "info symbol \$pc" -ex "x/6i \$pc" -ex "bt 40" -ex "info registers" \
                --args "$PY" -m pytest tests/wrappers_tests -m docker_required -k test_s19 -p no:cacheprovider -q \
                > run-$i.log 2>&1
              if grep -q "received signal SIG" run-$i.log; then
                crashed=1
                echo "=== iteration $i: signal"
                sed -n '/received signal SIG/,$p' run-$i.log
              else
                echo "iteration $i: $(grep -E '[0-9]+ (passed|failed|xfailed|xpassed)' run-$i.log | tail -1)"
              fi
            else
              "$PY" -m pytest tests/wrappers_tests -m docker_required -k test_s19 -p no:cacheprovider -q > run-$i.log 2>&1
              rc=$?
              if ls /tmp/core.* > /dev/null 2>&1; then
                crashed=1
                echo "=== iteration $i: exit $rc, core dumped"
                gdb -batch -q -ex "info symbol \$pc" -ex "x/6i \$pc" -ex "bt 40" -ex "info registers" "$PY" /tmp/core.*
              else
                echo "iteration $i: exit $rc $(grep -E '[0-9]+ (passed|failed|xfailed|xpassed)' run-$i.log | tail -1)"
              fi
            fi
          done
          exit $crashed
