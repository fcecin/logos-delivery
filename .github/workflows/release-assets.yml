name: Upload Release Asset

on:
  push:
    tags:
    - 'v*' # "e.g. v0.4"

  workflow_dispatch:

env:
  NPROC: 2
  NIM_PARAMS: "-d:disableMarchNative"
  NIM_VERSION: '2.2.4'
  NIMBLE_VERSION: '0.22.3'

jobs:
  # Release gate: the pushed tag MUST exactly match logos_delivery.nimble's version,
  # so every published artifact reports the correct getNodeInfo Version.
  # CI cannot reject/remove a tag, so we gate artifact build & upload on
  # this instead: a mismatched tag yields no released artifacts.
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert pushed tag equals logos_delivery.nimble version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          NIMBLE_VERSION=$(grep -m1 '^version = ' logos_delivery.nimble | sed -E 's/version = "([^"]+)"/\1/')
          # Strip leading v and any prerelease suffix (e.g. v0.38.0-rc.1 ->
          # 0.38.0) so release-candidate tags build against the same
          # logos_delivery.nimble version as the final tag.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          echo "tag:                 ${GITHUB_REF_NAME} (base ${BASE_VERSION})"
          echo "logos_delivery.nimble version: ${NIMBLE_VERSION}"
          if [ "${BASE_VERSION}" != "${NIMBLE_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (base ${BASE_VERSION}) does not match"
            echo "::error::logos_delivery.nimble version (${NIMBLE_VERSION}). Bump logos_delivery.nimble before tagging."
            exit 1
          fi
          echo "OK: tag base matches logos_delivery.nimble."

  build-and-upload:
    needs: verify-version
    strategy:
      # GitHub macOS runners are arm64 only; darwin/amd64 needs a cross-compilation setup.
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          arch: amd64
        - os: macos-15
          arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    name: ${{ matrix.os }} - ${{ matrix.arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nimble ${{ env.NIMBLE_VERSION }}
        run: |
          cd /tmp && nimble install "nimble@${{ env.NIMBLE_VERSION }}" -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH

      - name: Get submodules hash
        id: submodules
        run: |
          echo "hash=$(git submodule status | awk '{print $1}' | sort | shasum -a 256 | sed 's/[ -]*//g')" >> $GITHUB_OUTPUT

      - name: Cache submodules
        uses: actions/cache@v3
        with:
          path: |
            vendor/
            .git/modules
          key: ${{ runner.os }}-${{matrix.arch}}-submodules-${{ steps.submodules.outputs.hash }}

      - name: Get tag
        id: version
        run: |
          # Use full tag, e.g., v0.37.0
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          # dpkg needs a version that starts with a digit. A dispatch from a
          # branch gives a branch name here. Use 0.0.0~<branch> for such test
          # builds, so the workflow also runs from a branch.
          DEB_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$DEB_VERSION" =~ ^[0-9] ]] || DEB_VERSION="0.0.0~${DEB_VERSION//\//-}"
          echo "deb_version=${DEB_VERSION}" >> $GITHUB_OUTPUT

      - name: Prep variables
        id: vars
        run: |
          VERSION=${{ steps.version.outputs.version }}

          NWAKU_ARTIFACT_NAME=$(echo "waku-${{matrix.arch}}-${{runner.os}}.tar.gz" | tr "[:upper:]" "[:lower:]")
          echo "waku=${NWAKU_ARTIFACT_NAME}" >> $GITHUB_OUTPUT

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            LIBLOGOSDELIVERY_ARTIFACT_NAME=$(echo "liblogosdelivery-${VERSION}-${{matrix.arch}}-${{runner.os}}-linux.deb" | tr "[:upper:]" "[:lower:]")
          fi

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            LIBLOGOSDELIVERY_ARTIFACT_NAME=$(echo "liblogosdelivery-${VERSION}-${{matrix.arch}}-macos.tar.gz" | tr "[:upper:]" "[:lower:]")
          fi

          echo "liblogosdelivery=${LIBLOGOSDELIVERY_ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y build-essential dpkg-dev
          fi

      - name: Build Waku artifacts
        run: |
          # One make target for each line. Two parallel nimble processes
          # corrupt the shared package metadata.
          make -j${NPROC} POSTGRES=1 CI=false wakunode2
          make -j${NPROC} CI=false chat2
          make -j${NPROC} POSTGRES=1 CI=false logosdeliverynode
          tar -cvzf ${{steps.vars.outputs.waku}} ./build/

          make -j${NPROC} POSTGRES=1 CI=false liblogosdelivery
          make -j${NPROC} POSTGRES=1 CI=false STATIC=1 liblogosdelivery

      - name: Create distributable liblogosdelivery package
        run: |
          VERSION=${{ steps.version.outputs.version }}

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            rm -rf pkg
            mkdir -p pkg/DEBIAN pkg/usr/local/lib pkg/usr/local/include
            cp build/liblogosdelivery.so pkg/usr/local/lib/
            cp build/liblogosdelivery.a pkg/usr/local/lib/
            cp library/liblogosdelivery.h pkg/usr/local/include/
            cp library/liblogosdelivery_kernel.h pkg/usr/local/include/

            echo "Package: logosdelivery" >> pkg/DEBIAN/control
            echo "Version: ${{ steps.version.outputs.deb_version }}" >> pkg/DEBIAN/control
            echo "Priority: optional" >> pkg/DEBIAN/control
            echo "Section: libs" >> pkg/DEBIAN/control
            echo "Architecture: ${{matrix.arch}}" >> pkg/DEBIAN/control
            echo "Maintainer: Logos Messaging Team" >> pkg/DEBIAN/control
            echo "Description: Logos Delivery library" >> pkg/DEBIAN/control

            dpkg-deb --build pkg ${{steps.vars.outputs.liblogosdelivery}}
          fi

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            tar -cvzf ${{steps.vars.outputs.liblogosdelivery}} ./build/liblogosdelivery.dylib ./build/liblogosdelivery.a ./library/liblogosdelivery.h ./library/liblogosdelivery_kernel.h
          fi

      # This step examines the artifacts before the upload steps.
      # If this step finds a fault, the job stops and uploads nothing.
      - name: Verify artifacts
        run: |
          set -e
          # The matrix arch names the CPU type that each binary must have.
          case "${{ matrix.arch }}" in
            amd64) want='x86-64' ;;
            arm64) want='arm64|aarch64' ;;
            *) echo "FAIL: unknown arch: ${{ matrix.arch }}"; exit 1 ;;
          esac

          # The waku tarball must contain the three node binaries, and
          # the file command must show the correct CPU type for each.
          # The pattern examines only the text after the ":" that the
          # file command writes.
          rm -rf /tmp/x && mkdir -p /tmp/x
          tar -xzf "${{ steps.vars.outputs.waku }}" -C /tmp/x
          for b in wakunode2 logosdeliverynode chat2; do
            f="/tmp/x/build/$b"
            [ -f "$f" ] || { echo "FAIL: waku tarball does not contain build/$b"; exit 1; }
            file "$f"
            file "$f" | grep -Eq ": .*($want)" || { echo "FAIL: $b has a wrong CPU type (want: $want)"; exit 1; }
          done

          # The library package must contain the shared library, and the
          # library must have the correct CPU type.
          rm -rf /tmp/y && mkdir -p /tmp/y
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            dpkg-deb -x "${{ steps.vars.outputs.liblogosdelivery }}" /tmp/y
            lib="/tmp/y/usr/local/lib/liblogosdelivery.so"
          else
            tar -xzf "${{ steps.vars.outputs.liblogosdelivery }}" -C /tmp/y
            lib="/tmp/y/build/liblogosdelivery.dylib"
          fi
          [ -f "$lib" ] || { echo "FAIL: library package does not contain $(basename $lib)"; exit 1; }
          file "$lib"
          file "$lib" | grep -Eq ": .*($want)" || { echo "FAIL: library has a wrong CPU type (want: $want)"; exit 1; }

      - name: Upload waku artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: waku-${{ steps.version.outputs.version }}-${{ matrix.arch }}-${{ runner.os }}
          path: ${{ steps.vars.outputs.waku }}
          if-no-files-found: error

      - name: Upload liblogosdelivery artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: liblogosdelivery-${{ steps.version.outputs.version }}-${{ matrix.arch }}-${{ runner.os }}
          path: ${{ steps.vars.outputs.liblogosdelivery }}
          if-no-files-found: error
