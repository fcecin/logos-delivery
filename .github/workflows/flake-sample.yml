name: flake-sample

# DIAGNOSTIC, fork only. Builds liblogosdelivery once, then runs the
# send-api-e2e non-docker suite N times in parallel to measure the flake rate.
# `make all` is avoided: wakunode2 and logosdeliverynode are not needed here.

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "How many parallel e2e samples (1-10)."
        type: string
        default: "5"

env:
  NPROC: 2
  MAKEFLAGS: "-j${NPROC}"
  NIMFLAGS: "--parallelBuild:${NPROC} --colors:off -d:chronicles_colors:none -d:disableMarchNative"
  NIM_VERSION: '2.2.6'
  NIMBLE_VERSION: '0.24.1'

jobs:
  lib:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim ${{ env.NIM_VERSION }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install nimble deps
        uses: ./.github/actions/nimble-deps
        with:
          nimble-version: ${{ env.NIMBLE_VERSION }}
          nim-version: ${{ env.NIM_VERSION }}
      - name: Build only the shared library
        run: make V=1 -j1 liblogosdelivery
      - name: Audit installed deps
        run: make audit-deps
      - uses: actions/upload-artifact@v4
        with:
          name: liblogosdelivery
          path: build/liblogosdelivery.so
          retention-days: 1

  fanout:
    needs: lib
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          N=${{ inputs.samples }}
          echo "matrix=$(seq 1 "$N" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: fanout
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.fanout.outputs.matrix) }}
    uses: ./.github/workflows/e2e-api-tests.yml
    with:
      subset: non-docker
